[project]
name = "awiki-open-server"
version = "0.1.0"
description = "Single-process Awiki Community Server MVP"
requires-python = ">=3.10"
dependencies = [
  "anp==1.0.3",
  "base58",
  "cryptography<49",
  "fastapi",
  "jcs",
  "pydantic",
  "uvicorn",
]

[dependency-groups]
dev = [
  "httpx",
  "pytest",
  "pytest-asyncio",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/awiki_open_server"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
